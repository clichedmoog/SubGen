name: SubGen
options:
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    DEVELOPMENT_TEAM: N9LYHMUDKA
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  SubGen:
    type: application
    productName: SubGen
    platform: macOS
    sources:
      - path: SubtitleGen
        excludes: [Resources, ToolArchiveInstaller.swift]
      - path: SubtitleGen/Resources/AppIcon.icns
        buildPhase: resources
      - path: SubtitleGen/Resources/IconSource/AppIcon.icon
        buildPhase: resources
      - path: SubtitleGen/Resources/Licenses
        type: folder
        buildPhase: resources
      - path: Store/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: SubtitleGen/Resources/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SubGen
        PRODUCT_MODULE_NAME: SubtitleGen
        PRODUCT_BUNDLE_IDENTIFIER: com.clichedmoog.subtitle-generator
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "10"
        INFOPLIST_FILE: Store/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Store/Resources/SubGen.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", MAC_APP_STORE]
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
    postBuildScripts:
      - name: Embed sandboxed media tools
        script: bash "${SRCROOT}/scripts/embed-store-tools.sh"
        basedOnDependencyAnalysis: false
    scheme:
      gatherCoverageData: false
      testTargets:
        - SubGenRuntimeTests
  SubGenRuntimeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Store/Tests
    dependencies:
      - target: SubGen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clichedmoog.subtitle-generator.runtime-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SubGen.app/Contents/MacOS/SubGen"
        BUNDLE_LOADER: "$(TEST_HOST)"
