<?xml version="1.0" encoding="UTF-8"?>
<!--
  SubtitleGen app icon, full-detail master (used for 64px and larger).
  Concept: an audio waveform above a subtitle caption panel. The white caption
  line is the transcript; the amber line below it is the translation.
  Grid: 1024x1024 canvas, macOS tile 824x824 at (100,100).
  Rasterized by scripts/generate-app-icon.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="180" y1="100" x2="844" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C63C6"/>
      <stop offset="0.55" stop-color="#1B4E9E"/>
      <stop offset="1" stop-color="#0D7782"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="100" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="190" x2="0" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BDEDEE"/>
    </linearGradient>
    <linearGradient id="amber" x1="330" y1="0" x2="694" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC861"/>
      <stop offset="1" stop-color="#FF8F45"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="570" x2="0" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06173A" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#06173A" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="tileShadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#04122E" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tileShadow)"/>
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="460" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Waveform: seven rounded bars, symmetric envelope -->
  <g fill="url(#bar)" filter="url(#soft)">
    <rect x="226" y="320" width="56" height="100" rx="28"/>
    <rect x="312" y="272" width="56" height="196" rx="28"/>
    <rect x="398" y="222" width="56" height="296" rx="28"/>
    <rect x="484" y="190" width="56" height="350" rx="28"/>
    <rect x="570" y="232" width="56" height="276" rx="28"/>
    <rect x="656" y="282" width="56" height="176" rx="28"/>
    <rect x="742" y="326" width="56" height="88" rx="28"/>
  </g>

  <!-- Caption panel with a tail pointing up at the waveform -->
  <path d="M256 604 H478 L504 578 Q512 570 520 578 L546 604 H768 A60 60 0 0 1 828 664 V760 A60 60 0 0 1 768 820 H256 A60 60 0 0 1 196 760 V664 A60 60 0 0 1 256 604 Z" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- Transcript line (white) and translation line (amber) -->
  <rect x="270" y="648" width="484" height="48" rx="24" fill="#FFFFFF"/>
  <rect x="330" y="728" width="364" height="48" rx="24" fill="url(#amber)"/>
</svg>
